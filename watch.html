<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Audi Film Viewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="player-page single-watch-page">
  <main class="player-shell" aria-label="Audi film viewer">
    <div id="watchMount" class="player-mount"></div>
  </main>

  <section id="watchStart" class="start-screen">
    <div class="start-card">
      <p class="eyebrow">Audi Film Library</p>
      <h1 id="watchTitle">Audi Film</h1>
      <p id="watchMeta" class="subheading"></p>
      <button id="watchButton" class="start-video-button" type="button">
        <span class="play-icon" aria-hidden="true">▶</span>
        <span>Play Film</span>
      </button>
      <p class="fullscreen-note">This film opened in a separate tab. Close this tab when finished.</p>
    </div>
  </section>

  <aside id="watchStatus" class="now-playing"></aside>

  <script src="videos.js"></script>
  <script src="player-engine.js"></script>
  <script src="watch.js"></script>
</body>
</html>
