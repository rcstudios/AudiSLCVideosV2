<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Audi MediaTV Player</title>
  <style>
    html, body, #audiMount {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #audiMount,
    #audiMount > *,
    #audiMount iframe,
    #audiMount video,
    #audiMount object,
    #audiMount embed {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
    }

    #audiMount iframe,
    #audiMount video {
      display: block;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="audiMount"></div>
  <script src="audi-player.js"></script>
</body>
</html>
